name: Assemble RS AdminMenu ZIP
on:
  push:
    branches:
      - main
    paths:
      - '.release-staging/rs-adminmenu.part-*'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release-staging/rs-adminmenu.part-{01..06} > rs-adminmenu.zip
          echo "d38571c334128c7c648077ea46fc750792a3a8f048e21ae1db0f3961afc38041  rs-adminmenu.zip" | sha256sum --check -
      - name: Commit verified release ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rs-adminmenu.zip
          git commit -m "Publish clean RS AdminMenu v0.15.8 ZIP"
          git push origin HEAD:main
