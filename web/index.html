<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RS Adminmenu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:transparent!important">
<div id="app" class="hidden" aria-hidden="true" data-page="dashboard" data-text="medium" data-font="modern" data-motion="smooth" data-depth="medium">
  <div class="tablet-device" aria-label="RS Admin tablet">
    <div class="tablet-screen">
  <div class="shell">
    <header class="topbar">
      <button class="brand" id="brandHome"><span class="rs">RS</span><span><b>ADMINMENU</b><small>REALITYSUCKSRP CONTROL</small></span></button>
      <nav id="nav" class="nav"></nav>
      <div class="top-actions">
        <button id="dutyBtn" class="duty-btn off" title="Toggle duty"><span class="dot"></span><span id="dutyText">OFF DUTY</span></button>
        <button id="quickBtn" class="icon-btn" title="Quick Menu">◎</button>
        <button id="searchBtn" class="icon-btn" title="Search">⌕</button>
        <button id="refreshBtn" class="icon-btn" title="Refresh">↻</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
        <button id="dockBtn" class="icon-btn" title="Dock">▱</button>
        <button id="closeBtn" class="icon-btn danger" title="Close">×</button>
      </div>
    </header>
    <div id="subnav" class="subnav"></div>
    <main id="content" class="content"></main>
    <footer><span id="staffIdentity">AUTHORIZED STAFF</span><span id="status">READY</span><span id="framework">STANDALONE</span></footer>
  </div>
  <aside id="operatorDock" class="operator-dock hidden">
    <div class="dock-head"><span><b>RS OWNER</b><small>HOLD ALT TO CLICK · /RSADMIN TO REOPEN</small></span><button id="dockExpand" class="dock-expand" title="Expand">↗</button></div>
    <div class="dock-stats"><span><b id="dockPlayers">0</b> PLAYERS</span><span><b id="dockReports">0</b> REPORTS</span><span><b id="dockStaff">0</b> STAFF</span></div>
    <div class="dock-actions"><button data-dock-action="heal">HEAL</button><button data-dock-action="noclip">NOCLIP</button><button data-dock-action="gotoWaypoint">WAYPOINT</button><button data-dock-action="reports">REPORTS</button><button data-dock-action="players">PLAYERS</button><button data-dock-action="vehicleRepair">REPAIR</button></div>
  </aside>
  <div id="toasts" class="toasts"></div>
  <div id="quickWheel" class="quick-overlay hidden">
    <div class="quick-wheel-card">
      <header><div><small>RS ADMIN</small><h2>QUICK OPERATIONS</h2></div><button id="quickClose" class="icon-btn">×</button></header>
      <div id="quickActions" class="quick-actions"></div>
      <div class="quick-hint">F10 or /fadminmenu · permissions still enforced server-side</div>
    </div>
  </div>

  <div id="modal" class="overlay hidden"><div class="modal"><header><div><small>RS ADMIN</small><h2 id="modalTitle">ACTION</h2></div><button id="modalClose" class="icon-btn">×</button></header><div id="modalBody" class="modal-body"></div><div id="modalActions" class="modal-actions"></div></div></div>
  <div id="palette" class="overlay hidden"><div class="palette"><div class="palette-search"><span>⌕</span><input id="paletteInput" placeholder="Search pages, players and actions…"><kbd>ESC</kbd></div><div id="paletteResults"></div></div></div>
    </div>
    <img class="tablet-frame" src="assets/tablet-frame.png" alt="" draggable="false">
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
